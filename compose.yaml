name: freshcontext

services:
  hydra-init:
    image: node:24.14.1-alpine
    user: '0:0'
    command: ['node', '/scripts/init-hydra-volume.mjs']
    restart: 'no'
    volumes:
      - hydra-data:/data
      - ./scripts/init-hydra-volume.mjs:/scripts/init-hydra-volume.mjs:ro

  hydra:
    image: ghcr.io/hydra-db/hydradb@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    depends_on:
      hydra-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: freshcontext
      GRAPH_ID: freshcontext
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: 'true'
      RUST_MIN_STACK: '33554432'
    volumes:
      - hydra-data:/data

  freshcontext:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '2000'
      HYDRA_STARTUP_TIMEOUT_MS: '120000'
    ports:
      - '127.0.0.1:${FRESHCONTEXT_PORT:-3000}:3000'
    volumes:
      - hydra-data:/run/hydra:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 4s
      retries: 60
      start_period: 5s

volumes:
  hydra-data:
