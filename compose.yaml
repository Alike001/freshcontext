name: freshcontext

services:
  example-init:
    image: node:24.14.1-alpine
    user: '0:0'
    command: ['chown', '-R', '1000:1000', '/data/example']
    restart: 'no'
    volumes:
      - example-data:/data/example

  hydra-init:
    image: node:24.14.1-alpine
    user: '0:0'
    command: ['node', '/scripts/init-hydra-volume.mjs']
    restart: 'no'
    volumes:
      - hydra-data:/data
      - ./scripts/init-hydra-volume.mjs:/scripts/init-hydra-volume.mjs:ro

  hydra:
    image: ghcr.io/hydra-db/hydradb@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    depends_on:
      hydra-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: freshcontext
      GRAPH_ID: freshcontext
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: 'true'
      RUST_MIN_STACK: '33554432'
    volumes:
      - hydra-data:/data

  freshcontext:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      example-init:
        condition: service_completed_successfully
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '5000'
      HYDRA_STARTUP_TIMEOUT_MS: '120000'
      FRESHCONTEXT_REPOSITORY_ID: freshcontext-checkout-example
      FRESHCONTEXT_REPOSITORY_PATH: /data/example/checkout
      FRESHCONTEXT_EXAMPLE_MODE: '1'
    ports:
      - '127.0.0.1:${FRESHCONTEXT_PORT:-3000}:3000'
    volumes:
      - hydra-data:/run/hydra:ro
      - example-data:/data/example
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 4s
      retries: 60
      start_period: 5s

  mcp:
    profiles: ['tools']
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-runtime
    depends_on:
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    environment:
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '5000'
    volumes:
      - hydra-data:/run/hydra:ro

  evaluation:
    profiles: ['tools']
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    depends_on:
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    command: ['pnpm', '--filter', '@freshcontext/evaluation', 'evaluate']
    environment:
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '5000'
      FRESHCONTEXT_EVALUATION_OUTPUT: /output/latest.json
    volumes:
      - hydra-data:/run/hydra:ro
      - ./.freshcontext/evaluation:/output

  graph-contract-test:
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    depends_on:
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    command: ['pnpm', '--filter', '@freshcontext/graph', 'test:contract']
    environment:
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '5000'
      HYDRA_CONTRACT_TEST: '1'
    volumes:
      - hydra-data:/run/hydra:ro

  indexer-contract-test:
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    depends_on:
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    command: ['pnpm', '--filter', '@freshcontext/indexer', 'test:contract']
    environment:
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '5000'
      HYDRA_INDEXER_CONTRACT_TEST: '1'
    volumes:
      - hydra-data:/run/hydra:ro

  mcp-contract-test:
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    depends_on:
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    command: ['pnpm', '--filter', '@freshcontext/mcp', 'test:contract']
    environment:
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '5000'
      HYDRA_MCP_CONTRACT_TEST: '1'
    volumes:
      - hydra-data:/run/hydra:ro

  core-contract-test:
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    depends_on:
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    command: ['pnpm', '--filter', '@freshcontext/core', 'test:contract']
    environment:
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '5000'
      HYDRA_CORE_CONTRACT_TEST: '1'
    volumes:
      - hydra-data:/run/hydra:ro

  evaluation-contract-test:
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    depends_on:
      hydra:
        condition: service_started
      hydra-init:
        condition: service_completed_successfully
    command: ['pnpm', '--filter', '@freshcontext/evaluation', 'test', 'test/contract.test.ts']
    environment:
      HYDRA_QUERY_BASE_URL: http://hydra:8443
      HYDRA_ADMIN_BASE_URL: http://hydra:9090
      HYDRA_GRAPH_ID: freshcontext
      HYDRA_GRAPH_NAMESPACE: freshcontext
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /run/hydra/auth-token
      HYDRA_REQUEST_TIMEOUT_MS: '5000'
      HYDRA_EVALUATION_CONTRACT_TEST: '1'
    volumes:
      - hydra-data:/run/hydra:ro

volumes:
  hydra-data:
  example-data:
